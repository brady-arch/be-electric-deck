<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Be Electric Studios</title><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#000000"><style>
@font-face{font-family:"BSD";font-weight:700;font-display:swap;src:url(fonts/big-shoulders-display-latin-700-normal.woff2) format("woff2")}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;overflow:hidden}
body{font-family:"BST",Arial Narrow,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000;cursor:pointer}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s ease-in-out,visibility 0s .7s}

.g{color:#00A050}b{font-weight:700;color:#fff}a{color:inherit}
.img,.wimg,.gimg,.cimg{background-size:cover;background-position:center;background-color:#1A1A1A}
.img{position:absolute}

.head{display:grid;grid-template-columns:860px 824px;column-gap:44px;padding:96px 96px 56px;flex:none}

.wimg{flex:1}

.gal .big,.gal .side{display:flex;flex-direction:column;min-height:0}
.cap{height:70px;padding-top:18px;flex:none}.big .cap{padding-left:96px}
.chead{padding:96px 96px 48px}.chead .kick{margin-bottom:14px}
.cards{display:flex;gap:48px;padding:0 96px}.card{width:544px}
.card:nth-child(2){margin-top:44px}.card:nth-child(3){margin-top:88px}
.cimg{height:306px;margin-bottom:20px}.card .s{margin:6px 0 12px}
.lcol{position:absolute;left:96px;top:96px;width:760px}.lcol .l{margin-bottom:40px}.lcol .bl{margin-bottom:36px}
.rcol{position:absolute;left:980px;top:96px;width:844px}
.row{display:grid;grid-template-columns:120px 1fr;border-top:2px solid rgba(255,255,255,.25);padding:24px 0 32px}
.row .bm{margin-top:10px}
.wall{position:absolute;left:96px;top:420px;width:1728px}
.logos .head{padding-bottom:0}
.cgrid{position:absolute;left:96px;top:300px;display:grid;grid-template-columns:540px 540px;row-gap:54px}
.cgrid .label{margin-bottom:6px}.cgrid a{text-decoration:none}
#bolt{position:absolute;transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),height .9s cubic-bezier(.4,0,.2,1),fill .9s;pointer-events:none}
#bolt.big{left:1240px;top:-180px;height:1500px;fill:#00A050}
#bolt.off{left:2100px;top:240px;height:600px;fill:#1A1A1A}
@media (prefers-reduced-motion:reduce){.slide,.slide>*,#bolt{transition:none}}

#gate{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:96px;cursor:default}
#gate .logo{position:absolute;left:96px;top:88px;width:300px}
#gate form{display:flex;gap:16px;margin-top:40px;align-items:stretch}
#gate input{font:500 44px "BST",Arial Narrow,sans-serif;color:#fff;background:#000;border:0;border-bottom:4px solid #fff;width:640px;padding:8px 0;outline:0;border-radius:0}
#gate input:focus{border-color:#00A050}
#gate button{font:700 36px "BSD",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;background:#00A050;color:#000;border:0;padding:0 40px;cursor:pointer}
#gate .msg{height:40px;margin-top:20px}
@media (max-aspect-ratio:1/1){#gate input{font-size:72px;width:900px}#gate button{font-size:60px}}
</style></head><body><main class="stage" style="cursor:default"><div id="gate"><svg class="logo" viewBox="0 0 2516 700" role="img" aria-label="Be Electric"><defs><clipPath id="lc3_0"><rect x="0.0" y="0" width="200.0" height="700"/></clipPath><clipPath id="lc3_1"><rect x="253.0" y="0" width="180.0" height="700"/></clipPath><clipPath id="lc3_3"><rect x="853.0" y="0" width="180.0" height="700"/></clipPath><clipPath id="lc3_4"><rect x="1080.0" y="0" width="180.0" height="700"/></clipPath><clipPath id="lc3_5"><rect x="1293.0" y="0" width="180.0" height="700"/></clipPath><clipPath id="lc3_6"><rect x="1506.0" y="0" width="200.0" height="700"/></clipPath><clipPath id="lc3_7"><rect x="1726.0" y="0" width="200.0" height="700"/></clipPath><clipPath id="lc3_8"><rect x="1959.0" y="0" width="200.0" height="700"/></clipPath><clipPath id="lc3_9"><rect x="2199.0" y="0" width="70.0" height="700"/></clipPath><clipPath id="lc3_10"><rect x="2316.0" y="0" width="200.0" height="700"/></clipPath></defs><g fill="none" stroke="#fff" stroke-width="70" stroke-miterlimit="16"><g clip-path="url(#lc3_0)"><path d="M35.0 0.0 L35.0 700.0"/><path d="M35.0 35.0 L103.0 35.0 Q151.0 35.0 151.0 83.0 L151.0 302.0 Q151.0 350.0 103.0 350.0 L35.0 350.0"/><path d="M35.0 350.0 L117.0 350.0 Q165.0 350.0 165.0 398.0 L165.0 617.0 Q165.0 665.0 117.0 665.0 L35.0 665.0"/></g><g clip-path="url(#lc3_1)"><path d="M288.0 0.0 L288.0 700.0"/><path d="M288.0 35.0 L433.0 35.0"/><path d="M288.0 350.0 L411.4 350.0"/><path d="M288.0 665.0 L433.0 665.0"/></g><polygon fill="#00A050" points="580.0,13.0 773.0,13.0 653.0,310.0 767.0,310.0 513.0,693.0 577.0,373.0 500.0,373.0"/><g clip-path="url(#lc3_3)"><path d="M888.0 0.0 L888.0 700.0"/><path d="M888.0 35.0 L1033.0 35.0"/><path d="M888.0 350.0 L1011.4 350.0"/><path d="M888.0 665.0 L1033.0 665.0"/></g><g clip-path="url(#lc3_4)"><path d="M1115.0 0.0 L1115.0 700.0"/><path d="M1115.0 665.0 L1260.0 665.0"/></g><g clip-path="url(#lc3_5)"><path d="M1328.0 0.0 L1328.0 700.0"/><path d="M1328.0 35.0 L1473.0 35.0"/><path d="M1328.0 350.0 L1451.4 350.0"/><path d="M1328.0 665.0 L1473.0 665.0"/></g><g clip-path="url(#lc3_6)"><path d="M1671.0 224.0 L1671.0 83.0 Q1671.0 35.0 1623.0 35.0 L1589.0 35.0 Q1541.0 35.0 1541.0 83.0 L1541.0 617.0 Q1541.0 665.0 1589.0 665.0 L1623.0 665.0 Q1671.0 665.0 1671.0 617.0 L1671.0 476.0"/></g><g clip-path="url(#lc3_7)"><path d="M1726.0 35.0 L1926.0 35.0"/><path d="M1826.0 0.0 L1826.0 700.0"/></g><g clip-path="url(#lc3_8)"><path d="M1994.0 0.0 L1994.0 700.0"/><path d="M1994.0 35.0 L2076.0 35.0 Q2124.0 35.0 2124.0 83.0 L2124.0 344.0 Q2124.0 392.0 2076.0 392.0 L1994.0 392.0"/><path d="M2049.0 392.0 L2131.0 728.0"/></g><g clip-path="url(#lc3_9)"><path d="M2234.0 0.0 L2234.0 700.0"/></g><g clip-path="url(#lc3_10)"><path d="M2481.0 224.0 L2481.0 83.0 Q2481.0 35.0 2433.0 35.0 L2399.0 35.0 Q2351.0 35.0 2351.0 83.0 L2351.0 617.0 Q2351.0 665.0 2399.0 665.0 L2433.0 665.0 Q2481.0 665.0 2481.0 617.0 L2481.0 476.0"/></g></g></svg><h1 class="l">Enter password</h1><form><input type="password" autocomplete="off" autofocus aria-label="Password"><button type="submit">Open</button></form><p class="label g msg" role="alert"></p></div></main><script>
(function(){var st=document.querySelector('.stage'),gate=document.getElementById('gate'),f=gate.querySelector('form'),inp=f.querySelector('input'),msg=gate.querySelector('.msg');
var SALT="q5MYaCGOC8WlsX6+X0PfZg==",ITER=250000,key=null;
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform='scale('+s+') translate(-50%,-50%)';}
addEventListener('resize',fit);fit();
if(!(window.crypto&&crypto.subtle)){if(location.protocol==='http:'){location.replace('https://'+location.host+location.pathname+location.hash);}else{msg.textContent='This browser cannot open the deck.';}return;}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function derive(pw){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);});}
function dec(url){return fetch(url).then(function(r){return r.arrayBuffer();}).then(function(b){return crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b,0,12)},key,new Uint8Array(b,12));});}
function unlock(pw,quiet){return derive(pw).then(function(k){key=k;return dec('deck.bin');}).then(function(buf){try{sessionStorage.setItem('bepw',pw);}catch(e){}
 gate.remove();st.insertAdjacentHTML('beforeend',new TextDecoder().decode(buf));st.style.cursor='pointer';run();},function(){if(!quiet){msg.textContent='Wrong password';inp.select();}});}
f.addEventListener('submit',function(e){e.preventDefault();msg.textContent='';unlock(inp.value);});
try{var sv=sessionStorage.getItem('bepw');if(sv)unlock(sv,true);}catch(e){}
function run(){var sl=[].slice.call(document.querySelectorAll('.slide')),bolt=document.getElementById('bolt'),i=0,t=null,auto=!/still/.test(location.search);
[].slice.call(document.querySelectorAll('[data-i]')).reduce(function(p,el){return p.then(function(){return dec('img/'+el.dataset.i+'.bin');}).then(function(b){el.style.backgroundImage='url('+URL.createObjectURL(new Blob([b],{type:'image/jpeg'}))+')';},function(){});},Promise.resolve());
function show(n){i=(n+sl.length)%sl.length;sl.forEach(function(e,k){e.classList.toggle('on',k===i);});bolt.setAttribute('class',sl[i].dataset.bolt);
 if(history.replaceState)history.replaceState(null,'','#'+(i+1));clearTimeout(t);if(auto)t=setTimeout(function(){show(i+1);},parseFloat(sl[i].dataset.hold)*1000);}
var h=parseInt((location.hash||'').replace('#',''),10);show(h>0?h-1:0);
st.addEventListener('click',function(e){if(e.target.closest('a'))return;show(i+1);});
addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'){show(i+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(i-1);}else if(e.key===' '){e.preventDefault();auto=!auto;show(i);}});
var x0=null;st.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
st.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40){e.preventDefault();show(i+(dx<0?1:-1));}});}
})();
</script></body></html>
